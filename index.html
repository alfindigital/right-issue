<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kalkulator Right Issue - Hitung Jatah RI Saham IDX</title>
    <meta name="description" content="Kalkulator Right Issue untuk saham Indonesia (IDX). Hitung jumlah lembar RI, total biaya tebus, dan rekomendasi apakah layak ditebus berdasarkan harga teoritis TERP." />
    <meta name="author" content="alfindigital" />
    <meta name="keywords" content="right issue, kalkulator saham, IDX, TERP, saham Indonesia, investasi saham" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- Theme & language init (default: light + id) — runs before React to prevent FOUC -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (!t) { t = 'light'; localStorage.setItem('theme', 'light'); }
          var root = document.documentElement;
          if (t === 'dark') root.classList.add('dark');
          else root.classList.remove('dark');
          var l = localStorage.getItem('language');
          if (!l) { l = 'id'; localStorage.setItem('language', 'id'); }
          root.setAttribute('lang', l);
        } catch (e) {}
      })();
    </script>

    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
